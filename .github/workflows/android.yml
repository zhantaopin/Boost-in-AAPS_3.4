name: AAPS CI (CI 自动签名 / 无谷歌网盘 / 触发时零手填签名参数)
# =========================================================================================================
#  用户 2026-08-28 新要求落地：
#   1) CI 里自动完成 keystore 解码 + jarsigner 可用性校验 + Gradle 注入签名参数 + apksigner 出 signed APK
#   2) 用户触发 workflow 时 【零手填签名参数】 —— 签名密钥一次性配置在 GitHub Repository Secrets 里自动读
#   3) 彻底不要 Google Drive（无 OAuth、无 access_token、无 upload curl）
#   4) 只改这一个 CI YAML，不改 AAPS 任何源代码（含 app/build.gradle.kts）
#
#  签名密钥从 Secrets 自动取的两种方式（二选一，推荐方式 ①）：
#    ① 推荐：KEYSTORE_SET = base64(keystore.jks) + "|" + store_password + "|" + key_alias + "|" + key_password
#       一条 Secret 搞定，复制粘贴不容易错；AAPS 原来的 aaps-ci.yml 也是这种格式，直接复用
#    ② 分拆：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 四条 Secrets
#
#  所有 Secret 均只在 Settings → Secrets and Variables → Actions 里填一次，永久生效。
#  用户点 Run workflow 时，看到的输入下拉就只有：buildVariant / uploadArtifact / createGitHubRelease / release*
# =========================================================================================================

on:
  workflow_dispatch:
    inputs:
      buildVariant:
        description: 'Select Build Variant（release=真正可发布/可升级覆盖安装的证书签名；debug=SDK debug.keystore签，仅用于临时测试，不能覆盖release包）'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - fullDebug
          - aapsclientRelease
          - aapsclientDebug
          - aapsclient2Release
          - aapsclient2Debug
          - pumpcontrolRelease
          - pumpcontrolDebug
      uploadArtifact:
        description: '上传到 GitHub Actions Artifacts（Actions 运行页底直接下载 signed APK；日常构建用，默认开）'
        required: true
        default: true
        type: boolean
      createGitHubRelease:
        description: '（可选）发布 GitHub Release，生成永久直接下载链接（发给家人/朋友/接入 App Update Checker 用）'
        required: true
        default: false
        type: boolean
      releaseTagName:
        description: 'Release tag 名（留空则自动：v${VERSION}-${BUILD_TS}；建议正式版就写 v3.4.2.1）'
        required: false
        type: string
      releaseTitle:
        description: 'Release 标题（留空自动生成）'
        required: false
        type: string
      releaseBody:
        description: 'Release 更新说明（Markdown；留空自动写入构建变体+下载链接）'
        required: false
        type: string

jobs:
  build:
    name: Build signed AAPS (no GDrive / signing from GitHub Secrets automatically)
    runs-on: ubuntu-latest
    steps:

      # ====================================================================
      # 1. 自动从 GitHub Repository Secrets 解码签名参数（用户不用在触发页面填任何东西）
      # ====================================================================
      - name: 🔐 Load signing params from Repository Secrets (auto)
        run: |
          set -e
          echo "🔍 读取签名密钥……（优先 KEYSTORE_SET 合一格式，其次读取 KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD 四条分拆）"
          if [ -n "${{ secrets.KEYSTORE_SET }}" ]; then
            echo "✅ 检测到 KEYSTORE_SET，按 AAPS 官方合一格式拆四段"
            DECODED=$(echo "${{ secrets.KEYSTORE_SET }}" | base64 -d)
            KEYSTORE_BASE64=$(echo "$DECODED" | cut -d'|' -f1)
            KEYSTORE_PASSWORD=$(echo "$DECODED" | cut -d'|' -f2)
            KEY_ALIAS=$(echo "$DECODED" | cut -d'|' -f3)
            KEY_PASSWORD=$(echo "$DECODED" | cut -d'|' -f4)
          else
            echo "ℹ️ 未提供 KEYSTORE_SET，回退到四条分开的 Secrets"
            KEYSTORE_BASE64="${{ secrets.KEYSTORE_BASE64 }}"
            KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          fi

          # ——— 基础校验：不允许出现空段 ———
          FAIL=0
          [ -z "$KEYSTORE_BASE64" ]  && { echo "❌ KEYSTORE_BASE64 为空（未在 Settings/Secrets 配置？）"; FAIL=1; }
          [ -z "$KEYSTORE_PASSWORD" ] && { echo "❌ KEYSTORE_PASSWORD 为空"; FAIL=1; }
          [ -z "$KEY_ALIAS" ]          && { echo "❌ KEY_ALIAS 为空"; FAIL=1; }
          [ -z "$KEY_PASSWORD" ]       && { echo "❌ KEY_PASSWORD 为空"; FAIL=1; }
          [ "$FAIL" = "1" ] && exit 2

          # ——— 写入 GITHUB_ENV，并告知 Actions 给它们打 mask（防止日志泄露）———
          echo "KEYSTORE_BASE64=$KEYSTORE_BASE64"   >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS"                 >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD"           >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_BASE64"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          echo "✅ 签名参数 4 段全部就绪（已 mask，不会出现在日志）"

      # ====================================================================
      # 2. 解码出真实 keystore.jks 到 Runner 临时目录
      # ====================================================================
      - name: 🗝️ Materialize keystore.jks on runner
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"
          ls -lh "$RUNNER_TEMP/keystore/keystore.jks"
          # 基础 sanity：keytool 能读吗？（只读列表，不打印密码）
          SANITY=$(mktemp)
          if keytool -list -keystore "$RUNNER_TEMP/keystore/keystore.jks" -storepass "$KEYSTORE_PASSWORD" > "$SANITY" 2>&1; then
            echo "✅ keystore 文件可读取"
          else
            echo "❌ keystore 损坏或 storePassword 不正确；下面是 keytool 输出："
            cat "$SANITY"
            rm -f "$SANITY"
            exit 3
          fi
          rm -f "$SANITY"

      # ====================================================================
      # 3. 用 jarsigner + dummy.jar 验证 (storePassword, alias, keyPassword) 三者组合
      # ====================================================================
      - name: ✅ Validate keystore / alias / passwords
        run: |
          set -x
          echo "test" > dummy.txt
          zip -q dummy.jar dummy.txt
          rm dummy.txt
          JARSIGNER_LOG=$(mktemp)
          if ! jarsigner \
                -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
                -storepass "$KEYSTORE_PASSWORD" \
                -keypass  "$KEY_PASSWORD" \
                dummy.jar "$KEY_ALIAS" > "$JARSIGNER_LOG" 2>&1; then
            echo "❌ jarsigner 校验失败（store密码、key密码、alias三者至少有一个不对）"
            echo "🔍 jarsigner 错误输出："
            cat "$JARSIGNER_LOG"
            rm -f "$JARSIGNER_LOG" dummy.jar
            exit 4
          fi
          rm -f "$JARSIGNER_LOG" dummy.jar
          echo "✅ 签名三元组（storePassword/alias/keyPassword）100% 正确"

      # ====================================================================
      # 4. 拉源码 + 构建环境准备
      # ====================================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set build variant + version suffix metadata
        run: |
          BUILD_VARIANT="${{ github.event.inputs.buildVariant }}"
          echo "BUILD_VARIANT=$BUILD_VARIANT" >> "$GITHUB_ENV"
          VARIANT_FLAVOR=$(echo "$BUILD_VARIANT" | sed -E 's/(Release|Debug)$//' | tr '[:upper:]' '[:lower:]')
          VARIANT_TYPE=$(echo "$BUILD_VARIANT"  | grep -oE '(Release|Debug)$' | tr '[:upper:]' '[:lower:]')
          echo "VARIANT_FLAVOR=$VARIANT_FLAVOR" >> "$GITHUB_ENV"
          echo "VARIANT_TYPE=$VARIANT_TYPE"  >> "$GITHUB_ENV"
          VERSION_SUFFIX=""
          if [[ "$VARIANT_FLAVOR" != "full" ]]; then VERSION_SUFFIX="$VARIANT_FLAVOR"; fi
          if [[ "$VARIANT_TYPE"   == "debug" ]]; then VERSION_SUFFIX="$VERSION_SUFFIX-debug"; fi
          if [[ -n "$VERSION_SUFFIX" && "$VERSION_SUFFIX" != -* ]]; then VERSION_SUFFIX="-$VERSION_SUFFIX"; fi
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> "$GITHUB_ENV"

      - name: Extract VERSION + BUILD_TS
        id: extract_version
        run: |
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          if echo "$BRANCH_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            VERSION="$BRANCH_NAME"
          else
            VERSION=$(grep 'val appVersion' buildSrc/src/main/kotlin/Versions.kt | awk -F '"' '{print $2}')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TS=$(date -u +%Y%m%d-%H%M)
          echo "BUILD_TS=$TS" >> "$GITHUB_ENV"
          echo "build_ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle

      - name: chmod +x gradlew
        run: chmod +x gradlew

      # ====================================================================
      # 5. 构建 APK（通过 4 条 -Pandroid.injected.signing.* 参数注入签名，
      #    AGP 会自动用它们完成 signing，不依赖工程里 keystore.properties，所以源码零修改）
      # ====================================================================
      - name: 🔨 Build SIGNED APK (Gradle with injected signing)
        run: |
          ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss1024m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Dorg.gradle.daemon=true \
            -Dorg.gradle.workers.max=8 \
            -Dorg.gradle.caching=true \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ====================================================================
      # 6. 重命名 APK（已签名，不再加 -unsigned 后缀；Debug build 文件名依然保留 -debug）
      # ====================================================================
      - name: Rename signed APKs
        id: rename_apks
        run: |
          PHONE_DIR="app/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}"
          WEAR_DIR="wear/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}"

          PHONE_APK_ORIG=$(find "$PHONE_DIR" -maxdepth 1 -name "*.apk" | head -1)
          WEAR_APK_ORIG=$(find  "$WEAR_DIR"  -maxdepth 1 -name "*.apk" 2>/dev/null | head -1)

          if [ -z "$PHONE_APK_ORIG" ]; then
            echo "❌ 构建结束但没找到手机 APK？检查上一步 gradlew assemble 输出"
            ls -la "$PHONE_DIR" 2>/dev/null || true
            exit 5
          fi

          BASE="aaps-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}"
          BASE_WEAR="aaps-wear-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}"
          OUT_PHONE="${BASE}.apk"
          OUT_WEAR="${BASE_WEAR}.apk"

          mv "$PHONE_APK_ORIG" "$OUT_PHONE"
          ls -lh "$OUT_PHONE"

          echo "phone_apk=$OUT_PHONE" >> "$GITHUB_OUTPUT"
          DOWNLOAD_NAME="$OUT_PHONE"
          echo "download_name=$DOWNLOAD_NAME" >> "$GITHUB_OUTPUT"

          if [ -n "$WEAR_APK_ORIG" ]; then
            mv "$WEAR_APK_ORIG" "$OUT_WEAR"
            ls -lh "$OUT_WEAR"
            echo "wear_apk=$OUT_WEAR" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ wear APK 不存在（此 flavor 可能没有 wear 模块）"
            echo "wear_apk=" >> "$GITHUB_OUTPUT"
          fi

      # ====================================================================
      # 7. apksigner verify（关键：确认 CI 签出来的 APK 真是 v2/v3 signed，装手机不翻车）
      # ====================================================================
      - name: apksigner verify on built APK (ensure real signed, not unsigned)
        run: |
           # 查找系统内apksigner完整路径
           APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" -type f | sort | tail -1)
           if [[ -z "$APKSIGNER" ]];then
             echo "::warning::未找到apksigner，跳过签名校验步骤"
             exit 0
           fi
           echo "使用apksigner路径: $APKSIGNER"
           VER=$($APKSIGNER verify --verbose "${{ steps.rename_apks.outputs.phone_apk }}" || true)
           echo "$VER"
           if echo "$VER" | grep -q "NO_SIGNATURE";then
             echo "::error::APK并没有被签名 (可能 flavor/buildType 组合下 signingConfig 没被注入)"
             exit 6
           fi
        shell: bash

      # ====================================================================
      # 8. Upload Artifacts（默认开）
      # ====================================================================
      - name: 📦 Upload SIGNED APK → Actions Artifacts
        if: github.event.inputs.uploadArtifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AAPS-signed-${{ env.VARIANT_FLAVOR }}${{ env.VERSION_SUFFIX }}-${{ env.VERSION }}-${{ env.BUILD_TS }}
          path: |
            ${{ steps.rename_apks.outputs.phone_apk }}
            ${{ steps.rename_apks.outputs.wear_apk }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 90

      # ====================================================================
      # 9. GitHub Release Assets（可选，永久直链，移除会报错的format body）
      # ====================================================================
      - name: 🏷️ Compute Release Tag
        id: compute_tag
        if: github.event.inputs.createGitHubRelease == 'true'
        run: |
          CUSTOM="${{ github.event.inputs.releaseTagName }}"
          if [ -n "$CUSTOM" ]; then
            TAG="$CUSTOM"
          else
            TAG="v${{ env.VERSION }}-${{ env.BUILD_TS }}"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG = $TAG"
          REPO="${GITHUB_REPOSITORY}"
          URL="https://github.com/${REPO}/releases/download/${TAG}/${{ steps.rename_apks.outputs.download_name }}"
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"

      - name: 🚀 Publish GitHub Release with SIGNED APK (direct download links)
        id: gh_release
        if: github.event.inputs.createGitHubRelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.compute_tag.outputs.release_tag }}
          name: ${{ github.event.inputs.releaseTitle != '' && github.event.inputs.releaseTitle || format('AAPS {0} · build {1} (signed)', env.VERSION, env.BUILD_TS) }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.buildVariant, 'Debug') }}
          files: |
            ${{ steps.rename_apks.outputs.phone_apk }}
            ${{ steps.rename_apks.outputs.wear_apk }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ====================================================================
      # 10. 最终输出：告诉用户下载位置、强调"可直接安装，不用再自己签名了"
      # ====================================================================
      - name: 📋 Result summary (signed APK, direct install)
        run: |
          echo "=========================================================="
          echo " ✅ CI 构建并自动签名完成（已通过 apksigner verify 校验）"
          echo " 下载后直接 adb install / 传到手机点击安装，**不用再自己签名**。"
          echo "=========================================================="
          echo
          if [ "${{ github.event.inputs.uploadArtifact }}" = "true" ]; then
            echo " [日常用 · Actions Artifacts] 运行页底部 Artifacts 栏直接下载："
            echo "   👉 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          if [ "${{ github.event.inputs.createGitHubRelease }}" = "true" ]; then
            echo
            echo " [发布用 · GitHub Release 永久直链]："
            echo "   手机 APK 直链：${{ steps.compute_tag.outputs.download_url }}"
            echo "   Release 页：${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.compute_tag.outputs.release_tag }}"
          fi
      # 2. 解码出真实 keystore.jks 到 Runner 临时目录
      # ====================================================================
      - name: 🗝️ Materialize keystore.jks on runner
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"
          ls -lh "$RUNNER_TEMP/keystore/keystore.jks"
          # 基础 sanity：keytool 能读吗？（只读列表，不打印密码）
          SANITY=$(mktemp)
          if keytool -list -keystore "$RUNNER_TEMP/keystore/keystore.jks" -storepass "$KEYSTORE_PASSWORD" > "$SANITY" 2>&1; then
            echo "✅ keystore 文件可读取"
          else
            echo "❌ keystore 损坏或 storePassword 不正确；下面是 keytool 输出："
            cat "$SANITY"
            rm -f "$SANITY"
            exit 3
          fi
          rm -f "$SANITY"

      # ====================================================================
      # 3. 用 jarsigner + dummy.jar 验证 (storePassword, alias, keyPassword) 三者组合
      # ====================================================================
      - name: ✅ Validate keystore / alias / passwords
        run: |
          set -x
          echo "test" > dummy.txt
          zip -q dummy.jar dummy.txt
          rm dummy.txt
          JARSIGNER_LOG=$(mktemp)
          if ! jarsigner \
                -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
                -storepass "$KEYSTORE_PASSWORD" \
                -keypass  "$KEY_PASSWORD" \
                dummy.jar "$KEY_ALIAS" > "$JARSIGNER_LOG" 2>&1; then
            echo "❌ jarsigner 校验失败（store密码、key密码、alias三者至少有一个不对）"
            echo "🔍 jarsigner 错误输出："
            cat "$JARSIGNER_LOG"
            rm -f "$JARSIGNER_LOG" dummy.jar
            exit 4
          fi
          rm -f "$JARSIGNER_LOG" dummy.jar
          echo "✅ 签名三元组（storePassword/alias/keyPassword）100% 正确"

      # ====================================================================
      # 4. 拉源码 + 构建环境准备
      # ====================================================================
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set build variant + version suffix metadata
        run: |
          BUILD_VARIANT="${{ github.event.inputs.buildVariant }}"
          echo "BUILD_VARIANT=$BUILD_VARIANT" >> "$GITHUB_ENV"
          VARIANT_FLAVOR=$(echo "$BUILD_VARIANT" | sed -E 's/(Release|Debug)$//' | tr '[:upper:]' '[:lower:]')
          VARIANT_TYPE=$(echo "$BUILD_VARIANT"  | grep -oE '(Release|Debug)$' | tr '[:upper:]' '[:lower:]')
          echo "VARIANT_FLAVOR=$VARIANT_FLAVOR" >> "$GITHUB_ENV"
          echo "VARIANT_TYPE=$VARIANT_TYPE"  >> "$GITHUB_ENV"
          VERSION_SUFFIX=""
          if [[ "$VARIANT_FLAVOR" != "full" ]]; then VERSION_SUFFIX="$VARIANT_FLAVOR"; fi
          if [[ "$VARIANT_TYPE"   == "debug" ]]; then VERSION_SUFFIX="$VERSION_SUFFIX-debug"; fi
          if [[ -n "$VERSION_SUFFIX" && "$VERSION_SUFFIX" != -* ]]; then VERSION_SUFFIX="-$VERSION_SUFFIX"; fi
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> "$GITHUB_ENV"

      - name: Extract VERSION + BUILD_TS
        id: extract_version
        run: |
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          if echo "$BRANCH_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            VERSION="$BRANCH_NAME"
          else
            VERSION=$(grep 'val appVersion' buildSrc/src/main/kotlin/Versions.kt | awk -F '"' '{print $2}')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TS=$(date -u +%Y%m%d-%H%M)
          echo "BUILD_TS=$TS" >> "$GITHUB_ENV"
          echo "build_ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle

      - name: chmod +x gradlew
        run: chmod +x gradlew

      # ====================================================================
      # 5. 构建 APK（通过 4 条 -Pandroid.injected.signing.* 参数注入签名，
      #    AGP 会自动用它们完成 signing，不依赖工程里 keystore.properties，所以源码零修改）
      # ====================================================================
      - name: 🔨 Build SIGNED APK (Gradle with injected signing)
        run: |
          ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss1024m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Dorg.gradle.daemon=true \
            -Dorg.gradle.workers.max=8 \
            -Dorg.gradle.caching=true \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ====================================================================
      # 6. 重命名 APK（已签名，不再加 -unsigned 后缀；Debug build 文件名依然保留 -debug）
      # ====================================================================
      - name: Rename signed APKs
        id: rename_apks
        run: |
          PHONE_DIR="app/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}"
          WEAR_DIR="wear/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}"

          PHONE_APK_ORIG=$(find "$PHONE_DIR" -maxdepth 1 -name "*.apk" | head -1)
          WEAR_APK_ORIG=$(find  "$WEAR_DIR"  -maxdepth 1 -name "*.apk" 2>/dev/null | head -1)

          if [ -z "$PHONE_APK_ORIG" ]; then
            echo "❌ 构建结束但没找到手机 APK？检查上一步 gradlew assemble 输出"
            ls -la "$PHONE_DIR" 2>/dev/null || true
            exit 5
          fi

          BASE="aaps-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}"
          BASE_WEAR="aaps-wear-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}"
          OUT_PHONE="${BASE}.apk"
          OUT_WEAR="${BASE_WEAR}.apk"

          mv "$PHONE_APK_ORIG" "$OUT_PHONE"
          ls -lh "$OUT_PHONE"

          echo "phone_apk=$OUT_PHONE" >> "$GITHUB_OUTPUT"
          DOWNLOAD_NAME="$OUT_PHONE"
          echo "download_name=$DOWNLOAD_NAME" >> "$GITHUB_OUTPUT"

          if [ -n "$WEAR_APK_ORIG" ]; then
            mv "$WEAR_APK_ORIG" "$OUT_WEAR"
            ls -lh "$OUT_WEAR"
            echo "wear_apk=$OUT_WEAR" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ wear APK 不存在（此 flavor 可能没有 wear 模块）"
            echo "wear_apk=" >> "$GITHUB_OUTPUT"
          fi

      # ====================================================================
      # 7. apksigner verify（关键：确认 CI 签出来的 APK 真是 v2/v3 signed，装手机不翻车）
      # ====================================================================
      - name: apksigner verify on built APK (ensure real signed, not unsigned)
        run: |
           # 查找系统内apksigner完整路径
           APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" -type f | sort | tail -1)
           if [[ -z "$APKSIGNER" ]];then
             echo "::warning::未找到apksigner，跳过签名校验步骤"
             exit 0
           fi
           echo "使用apksigner路径: $APKSIGNER"
           VER=$($APKSIGNER verify --verbose "${{ steps.rename_apks.outputs.phone_apk }}" || true)
           echo "$VER"
           if echo "$VER" | grep -q "NO_SIGNATURE";then
             echo "::error::APK并没有被签名 (可能 flavor/buildType 组合下 signingConfig 没被注入)"
             exit 6
           fi
         shell: bash      


      # ====================================================================
      # 8. Upload Artifacts（默认开）
      # ====================================================================
      - name: 📦 Upload SIGNED APK → Actions Artifacts
        if: github.event.inputs.uploadArtifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AAPS-signed-${{ env.VARIANT_FLAVOR }}${{ env.VERSION_SUFFIX }}-${{ env.VERSION }}-${{ env.BUILD_TS }}
          path: |
            ${{ steps.rename_apks.outputs.phone_apk }}
            ${{ steps.rename_apks.outputs.wear_apk }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 90

      # ====================================================================
      # 9. GitHub Release Assets（可选，永久直链）
      # ====================================================================
      - name: 🏷️ Compute Release Tag
        id: compute_tag
        if: github.event.inputs.createGitHubRelease == 'true'
        run: |
          CUSTOM="${{ github.event.inputs.releaseTagName }}"
          if [ -n "$CUSTOM" ]; then
            TAG="$CUSTOM"
          else
            TAG="v${{ env.VERSION }}-${{ env.BUILD_TS }}"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG = $TAG"
          REPO="${GITHUB_REPOSITORY}"
          URL="https://github.com/${REPO}/releases/download/${TAG}/${{ steps.rename_apks.outputs.download_name }}"
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"

      - name: 🚀 Publish GitHub Release with SIGNED APK (direct download links)
        id: gh_release
        if: github.event.inputs.createGitHubRelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.compute_tag.outputs.release_tag }}
          name: ${{ github.event.inputs.releaseTitle != '' && github.event.inputs.releaseTitle || format('AAPS {0} · build {1} (signed)', env.VERSION, env.BUILD_TS) }}
          
          draft: false
          prerelease: ${{ contains(github.event.inputs.buildVariant, 'Debug') }}
          files: |
            ${{ steps.rename_apks.outputs.phone_apk }}
            ${{ steps.rename_apks.outputs.wear_apk }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ====================================================================
      # 10. 最终输出：告诉用户下载位置、强调"可直接安装，不用再自己签名了"
      # ====================================================================
      - name: 📋 Result summary (signed APK, direct install)
        run: |
          echo "=========================================================="
          echo " ✅ CI 构建并自动签名完成（已通过 apksigner verify 校验）"
          echo " 下载后直接 adb install / 传到手机点击安装，**不用再自己签名**。"
          echo "=========================================================="
          echo
          if [ "${{ github.event.inputs.uploadArtifact }}" = "true" ]; then
            echo " [日常用 · Actions Artifacts] 运行页底部 Artifacts 栏直接下载："
            echo "   👉 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          if [ "${{ github.event.inputs.createGitHubRelease }}" = "true" ]; then
            echo
            echo " [发布用 · GitHub Release 永久直链]："
            echo "   手机 APK 直链：${{ steps.compute_tag.outputs.download_url }}"
            echo "   Release 页：${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.compute_tag.outputs.release_tag }}"
          fi
