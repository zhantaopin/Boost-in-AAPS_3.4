  var h=document.getElementById('editor').value;
  document.getElementById('preview').src='data:text/html;charset=utf-8,'+encodeURIComponent(h);
}
function download(){
  var h=document.getElementById('editor').value;
  var blob=new Blob([h],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='boost-isf-calc.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){alert('✅ 已下载 boost-isf-calc.html\n\n电脑: 双击打开\n手机: 文件管理器→浏览器打开')},200);
}
function copyAll(){
  var h=document.getElementById('editor').value;
  var btn=document.getElementById('copyBtn');
  if(navigator.clipboard){
    navigator.clipboard.writeText(h).then(function(){
      btn.textContent='✅ 已复制!';btn.classList.add('done');
      setTimeout(function(){btn.textContent='📋 全部复制';btn.classList.remove('done')},1500);
    }).catch(function(){fallbackCopy(h,btn)});
  }else{
    fallbackCopy(h,btn);
  }
}
function fallbackCopy(text,btn){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);
  try{document.execCommand('copy');
    btn.textContent='✅ 已复制!';btn.classList.add('done');
    setTimeout(function(){btn.textContent='📋 全部复制';btn.classList.remove('done')},1500);
  }catch(err){alert('复制失败，请手动选中 textarea 里的代码按 Ctrl+C')}
  document.body.removeChild(ta);
}
document.getElementById('editor').addEventListener('input',function(){
  document.getElementById('cc').textContent='长度: '+this.value.length;
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();download()}
});
</script>
