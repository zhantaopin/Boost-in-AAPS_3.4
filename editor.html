async function initEditor(){
  try{
    // gzip 解压
    var bin = Uint8Array.from(atob(GZ_B64), function(c){return c.charCodeAt(0)});
    var dcmp = new DecompressionStream('gzip');
    var stream = new Blob([bin]).stream().pipeThrough(dcmp);
    var buf = await new Response(stream).arrayBuffer();
    var html = new TextDecoder('utf-8').decode(buf);
  } catch(e){
    alert('解压失败: ' + e.message + '\n将尝试直接解码...');
    var html = atob(GZ_B64);
  }
  
  document.getElementById('editor').value = html;
  runPreview();
  updateCount();
}

function updateCount(){
  document.getElementById('cc').textContent = '长度: ' + document.getElementById('editor').value.length;
}

function runPreview(){
  var h = document.getElementById('editor').value;
  document.getElementById('preview').srcdoc = h;
}

function copyAll(){
  var h = document.getElementById('editor').value;
  var btn = document.getElementById('copyBtn');
  if(navigator.clipboard){
    navigator.clipboard.writeText(h).then(function(){
      btn.textContent = '✅ 已复制!'; btn.classList.add('done');
      setTimeout(function(){ btn.textContent = '📋 全部复制'; btn.classList.remove('done'); }, 1500);
    }).catch(function(){ fallbackCopy(h, btn); });
  } else { fallbackCopy(h, btn); }
}
function fallbackCopy(text, btn){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
  try{ document.execCommand('copy');
    btn.textContent = '✅ 已复制!'; btn.classList.add('done');
    setTimeout(function(){ btn.textContent = '📋 全部复制'; btn.classList.remove('done'); }, 1500);
  } catch(err){ alert('复制失败，请手动选中 textarea 里的代码按 Ctrl+C'); }
  document.body.removeChild(ta);
}

// === 下载：生成 Blob URL，新窗口打开 ===
var _currentBlobUrl = null;
function showSaveModal(){
  var h = document.getElementById('editor').value;
  // 清理旧 blob
  if(_currentBlobUrl) URL.revokeObjectURL(_currentBlobUrl);
  var blob = new Blob([h], {type: 'text/html;charset=utf-8'});
  _currentBlobUrl = URL.createObjectURL(blob);
  
  var link = document.getElementById('saveLink');
  link.href = _currentBlobUrl;
  link.download = 'boost-isf-calc.html';
  
  document.getElementById('saveModal').classList.add('show');
}
function hideSaveModal(){
  document.getElementById('saveModal').classList.remove('show');
}

// 快捷键
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && e.key === 's'){
    e.preventDefault();
    showSaveModal();
  }
});

document.getElementById('editor').addEventListener('input', updateCount);

// 启动
initEditor();
</script>
